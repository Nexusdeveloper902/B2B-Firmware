; ---------------------------------------------------------------------------
; Presence Platform — Reader Firmware (ESP32)
; Plataforma de Presencia — Firmware del Lector (ESP32)
;
; Environments / Entornos:
;   esp32dev       Real hardware: RC522 NFC reader over SPI / Hardware real
;   esp32dev-mock  Development without board: virtual taps typed over Serial
;                  (default: the agent sandbox has no board attached)
;                  / Desarrollo sin placa: toques virtuales por Serial
;   native         Host-side unit tests of the hardware-independent logic
;                  (payloads, response parsing, mode machine, debounce)
;                  / Pruebas unitarias en el host de la lógica pura
; ---------------------------------------------------------------------------

[platformio]
default_envs = esp32dev-mock

[env]
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

; --- Real reader: RC522 over SPI -------------------------------------------
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPRESENCE_READER_IMPL_RC522
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    miguelbalboa/MFRC522@^1.4.11

; --- Mock reader: type a UID + Enter in the Serial Monitor to simulate a tap --
[env:esp32dev-mock]
platform = espressif32
framework = arduino
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPRESENCE_READER_IMPL_MOCK
lib_deps =
    bblanchon/ArduinoJson@^7.4.3

; --- Host-side unit tests (no Arduino, no board) ---------------------------
; NOTE: does not extend the [env] arduino settings on purpose.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>            ; tests only: src/main.cpp needs real Arduino
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
