; ---------------------------------------------------------------------------
; Pulse — Reader Firmware (ESP32)
; Firmware del Lector de Pulse (ESP32)
;
; Environments / Entornos:
;   esp32cam       DEFAULT env (ADR-010, station-first): the recycling
;                  station's CAMERA firmware (AI-Thinker ESP32-CAM,
;                  OV3660) — capture on ENTER, upload to B2B-Core, the
;                  visualizer, and the associate command. A bare `pio run`
;                  / `pio run -t upload` targets this station image.
;                  / Entorno POR DEFECTO (ADR-010, estación primero):
;                  firmware de CÁMARA de la estación de reciclaje
;                  (AI-Thinker ESP32-CAM, OV3660) — captura con ENTER,
;                  subida a B2B-Core, visualizador y comando de asociación.
;                  Un `pio run` / `pio run -t upload` simple apunta a esta
;                  imagen de estación.
;   esp32dev       Real hardware: RC522 NFC reader over SPI — opt-in since
;                  ADR-010 via `pio run -e esp32dev` / scripts/flash.sh --esp32.
;                  / Hardware real: RC522 por SPI — optativo desde ADR-010
;                  vía `pio run -e esp32dev` / scripts/flash.sh --esp32.
;   esp32dev-mock  Development without a reader attached: virtual taps typed
;                  over Serial — opt-in via `pio run -e esp32dev-mock`
;                  / Desarrollo sin lector: toques virtuales por Serial (opcional)
;   native         Host-side unit tests of the hardware-independent logic
;                  (payloads, response parsing, mode machine, debounce,
;                  capture trigger + multipart bodies)
;                  / Pruebas unitarias en el host de la lógica pura
; ---------------------------------------------------------------------------

[platformio]
; Station-first: the validated hardware is the ESP32-CAM station, so a bare
; `pio run` / `pio run -t upload` targets it. An accidental esp32dev upload
; to a CAM board was the original wrong-target failure — the reader DevKit
; stays fully supported via `pio run -e esp32dev` / scripts/flash.sh --esp32.
default_envs = esp32cam

[env]
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

; --- Real reader: RC522 over SPI (OPT-IN since ADR-010; default is esp32cam)
;     / Lector real: RC522 por SPI (OPTATIVO desde ADR-010; el default es esp32cam)
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPRESENCE_READER_IMPL_RC522
build_src_filter =
    +<main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    miguelbalboa/MFRC522@^1.4.11

; --- Mock reader (opt-in): type UID + Enter in Serial Monitor to simulate ---
[env:esp32dev-mock]
platform = espressif32
framework = arduino
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPRESENCE_READER_IMPL_MOCK
build_src_filter =
    +<main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.4.3

; --- TASK-008: the camera station (AI-Thinker ESP32-CAM, OV3660) ------------
; Pin map + init + capture logic merged from the verified reference
; (ESP32-CAM-CV/firmware/esp32_cam). monitor_dtr/monitor_rts MUST stay 0:
; the AI-Thinker auto-download circuit holds the chip in a bad state when
; the serial port is opened otherwise.
; / El mapa de pines + init + captura viene de la referencia verificada.
; monitor_dtr/monitor_rts DEBEN quedar en 0: el circuito auto-download del
; AI-Thinker deja el chip en mal estado al abrir el puerto serial.
[env:esp32cam]
platform = espressif32
framework = arduino
board = esp32cam
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DCAMERA_STATION
    ; Bench-proven 2026-09-07: DIAG-CAM reads a stable 0x92 at 1 MHz on
    ; Dupont wiring, while the library default 4 MHz garbles VersionReg
    ; (0x8F) and deafens card detection. esp32dev keeps the default.
    -DMFRC522_SPICLOCK=1000000u
build_src_filter =
    +<camera/>
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    espressif/esp32-camera
    miguelbalboa/MFRC522@^1.4.11

; --- Host-side unit tests (no Arduino, no board) ---------------------------
; NOTE: does not extend the [env] arduino settings on purpose.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>            ; tests only: src/ mains need real Arduino
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
